<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prediction Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
</head>
<style>
  /* General Styles */
body {
    margin: 100px;
    padding-right: 200px;
    font-family: 'Arial', sans-serif;
    background: linear-gradient(135deg, #6a11cb, #2575fc);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 150vh;
    color: #333;
  }
  
  /* Form Container */
  .form-container {
    background: #fff;
    padding: 2rem;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    width: 200%;
    max-width: 800px;
    text-align: center;
  }
  
  .form-container h1 {
    margin-bottom: 1.5rem;
    font-size: 3rem;
    color: #333433;
  }
  
  /* Form Group */
  .form-group {
    margin-bottom: 1rem;
    text-align: left;
  }
  
  .form-group label {
    display: block;
    margin-bottom: 0.5rem;
    font-weight: bold;
    color: #555;
  }
  
  .form-group input {
    width: 100%;
    padding: 0.75rem;
    border: 1px solid #ddd;
    border-radius: 5px;
    font-size: 1rem;
    transition: border-color 0.3s ease;
  }
  
  .form-group input:focus {
    border-color: #6a11cb;
    outline: none;
  }
  
  /* Submit Button */
  .submit-btn {
    width: 100%;
    padding: 0.75rem;
    background: #6a11cb;
    color: #fff;
    border: none;
    border-radius: 5px;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.3s ease;
  }
  
  .submit-btn:hover {
    background: #2575fc;
  }
  
  /* Responsive Design */
  @media (max-width: 480px) {
    .form-container {
      padding: 1.5rem;
    }
  
    .form-container h1 {
      font-size: 1.5rem;
    }
  
    .form-group input {
      padding: 0.5rem;
    }
  
    .submit-btn {
      padding: 0.5rem;
    }
  }

/* Result Container */
.result {
    padding: 2rem;
    margin-left: 5rem;
    border-radius: 15px;
    max-width: 500px;
    width: 100%;
    text-align: center;
}

/* Heading Style */
.result h5 {
    font-size: 1.5rem;
    color: #333;
    margin-bottom: 1rem;
    font-weight: 600;
}

/* Result Text Style */
.result .card_text {
    font-size: 1.25rem;
    color: #4CAF50; /* Green color for emphasis */
    background: #e8f5e9; /* Light green background */
    padding: 1rem;
    border-radius: 10px;
    border: 2px solid #4CAF50;
    margin-top: 1rem;
    animation: slideIn 0.5s ease-in-out;
}

/* Animation for Fade In */
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(-20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Animation for Slide In */
@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateX(-20px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

/* Responsive Design */
@media (max-width: 600px) {
    .result {
        padding: 1.5rem;
    }

    .result h5 {
        font-size: 1.25rem;
    }

    .result .card_text {
        font-size: 1rem;
        padding: 0.75rem;
    }
}


</style>
<body>
  <div class="form-container">
    <h1>Enter Details for Prediction</h1>
    <form id="prediction-form" action="/predict" method="POST" >
      <div class="form-group">
        <label for="N">Nitrogen (N):</label>
        <input type="number" id="N" name="N" placeholder="Enter Nitrogen value" required>
      </div>
      <div class="form-group">
        <label for="P">Phosphorus (P):</label>
        <input type="number" id="P" name="P" placeholder="Enter Phosphorus value" required>
      </div>
      <div class="form-group">
        <label for="K">Potassium (K):</label>
        <input type="number" id="K" name="K" placeholder="Enter Potassium value" required>
      </div>
      <div class="form-group">
        <label for="rainfall">Rainfall (mm):</label>
        <input type="number" id="rainfall" name="rainfall" placeholder="Enter Rainfall value" required>
      </div>
      <div class="form-group">
        <label for="ph">pH:</label>
        <input type="number" step="0.1" id="ph" name="ph" placeholder="Enter pH value" required>
      </div>
      <div class="form-group">
        <label for="humidity">Humidity (%):</label>
        <input type="number" id="humidity" name="humidity" placeholder="Enter Humidity value" required>
      </div>
      <div class="form-group">
        <label for="temperature">Temperature (°C):</label>
        <input type="number" step="0.1" id="temperature" name="temperature" placeholder="Enter Temperature value" required>
      </div>
      <button type="submit" class="submit-btn">Get Prediction</button>
    </form>
  </div>
  
  <div class="result">
  {% if result %}
  <h5>Recommendation crop for cultivation is: </h5>
  <p class="card_text">{{result}}</p>
  {% endif %}
  </div>

</body>
</html>
